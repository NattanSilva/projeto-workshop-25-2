<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | [Blogr]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/global.css" />
  </head>
  <body>
    <header id="header-container">
      <nav id="navbar">
        <h1 class="font-ubuntu-bold">Blogr</h1>
        <button>
          <img src="./assets/icon-hamburger.svg" alt="Menu icon" />
        </button>
      </nav>
      <div id="banner-container">
        <h2 class="font-ubuntu-medium">A modern publishing platform</h2>

        <p class="font-overpass-light">
          Grow your audience and build your online brand
        </p>
        <div id="banner-button-container">
          <button class="btn-white font-ubuntu-medium">Start for Free</button>
          <button class="btn-transparent font-ubuntu-medium">Learn More</button>
        </div>
      </div>
      <img
        id="header-cover-mobile"
        src="./assets/bg-pattern-intro-mobile.svg"
        alt="cover"
      />
      <img
        id="header-cover-desktop"
        src="./assets/bg-pattern-intro-desktop.svg"
        alt="cover"
      />
    </header>

    <!-- <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div> -->
  </body>
</html>
